<!doctype html><html lang="it"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mappa dei Talenti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: wizard a colonna singola (max 760px), colore riservato ai 4 domini, UI in inchiostro neutro */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --surface-2:#E8ECE6; --fg:#18211E; --muted:#58645F; --line:#D5DAD3;
  --ink:#18211E; --on-ink:#F3F5F1;
  --d0:#6A47A8; --d1:#BF5F14; --d2:#1C71A3; --d3:#34804A;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Hanken Grotesk",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --surface:#1A221E; --surface-2:#242E29; --fg:#E8EDE9; --muted:#9FAAA4; --line:#2E3832;
    --ink:#E8EDE9; --on-ink:#121815;
    --d0:#A58AE0; --d1:#F0A05C; --d2:#6DB4E0; --d3:#7FCB92; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1A221E; --surface-2:#242E29; --fg:#E8EDE9; --muted:#9FAAA4; --line:#2E3832;
  --ink:#E8EDE9; --on-ink:#121815;
  --d0:#A58AE0; --d1:#F0A05C; --d2:#6DB4E0; --d3:#7FCB92; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--body);padding-inline:16px;padding-block:8px 64px}
.wrap{max-width:760px;margin-inline:auto}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:6px}
[data-d="0"]{--dc:var(--d0)} [data-d="1"]{--dc:var(--d1)} [data-d="2"]{--dc:var(--d2)} [data-d="3"]{--dc:var(--d3)}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--on-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.sm{min-height:38px;padding:0 16px;font-size:.9rem}
.btn:disabled{opacity:.38;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
/* intro */
.intro h1{font-size:clamp(2.5rem,9vw,4rem);letter-spacing:-.02em}
.lead{font-size:1.2rem;line-height:1.5;max-width:34em;margin:14px 0 22px}
.note{border:1.5px solid var(--fg);border-radius:14px;padding:14px 16px;font-size:.95rem;background:var(--surface)}
.h-sm{font-size:1.15rem;margin:32px 0 10px}
.how{margin:0;padding-left:1.3em}
.how li{margin:.4em 0;max-width:44em}
.demo{margin-top:16px;border:1.5px dashed var(--line);border-radius:14px;padding:12px 12px 6px}
.demo p{margin:0 0 4px;font-size:.88rem;color:var(--muted)}
.doms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.dom{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.dom b{display:flex;align-items:center;gap:8px;font-family:var(--display)}
.dom b::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--dc);flex:none}
.dom span{display:block;font-size:.88rem;color:var(--muted);margin-top:2px}
/* test */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px}
.tb-row{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;color:var(--muted);margin-bottom:8px}
.brand{font-family:var(--display);font-weight:700;color:var(--fg)}
.prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .25s}
.pair{display:grid;gap:0}
.st{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px;display:flex;gap:14px;align-items:flex-start;transition:opacity .15s,border-color .15s,background .15s}
.st .num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 .85rem var(--display);background:var(--surface-2)}
.st p{margin:0;font-size:1.1rem;line-height:1.45}
.st.pick{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,var(--surface))}
.st.pick .num{background:var(--ink);color:var(--on-ink)}
.st.dim{opacity:.6}
.or{text-align:center;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-block:8px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:22px;align-items:start}
.sc{background:none;border:0;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.sc .dw{height:52px;display:grid;place-items:center}
.sc .dot{display:block;border-radius:50%;border:2px solid var(--muted);background:var(--surface);transition:border-color .12s,background .12s}
.s1 .dot,.s5 .dot{width:52px;height:52px}.s2 .dot,.s4 .dot{width:40px;height:40px}.s3 .dot{width:30px;height:30px}
.sc .lb{font-size:.74rem;line-height:1.2;text-align:center;color:var(--muted)}
.sc:hover:not(:disabled) .dot{border-color:var(--fg)}
.sc[aria-checked="true"] .dot{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 4px var(--surface)}
.sc[aria-checked="true"] .lb{color:var(--fg);font-weight:700}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:24px}
.hint{font-size:.82rem;color:var(--muted);margin:14px 0 0;display:none}
@media (hover:hover){.hint{display:block}}
.dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:22px}
.dots button{width:22px;height:22px;background:none;border:0;padding:0;display:grid;place-items:center}
.dots button::before{content:"";width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted)}
.dots .a::before{background:var(--fg);border-color:var(--fg)}
.dots .c::before{outline:2px solid var(--fg);outline-offset:2px}
/* risultati */
.rh{margin-top:20px}
.rh h1{font-size:clamp(2rem,7vw,2.8rem)}
.rh p{color:var(--muted);margin:8px 0 0;font-size:.92rem}
.rtools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:22px;overflow-x:auto}
.tab{padding:12px 14px;border:0;background:none;border-bottom:3px solid transparent;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--fg)}
.h-md{font-size:1.3rem;margin:30px 0 10px}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:999px;background:color-mix(in srgb,var(--dc) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--dc) 40%,var(--line));font-weight:600}
.chip b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--dc);color:var(--surface);font:700 .8rem var(--display)}
.dcw{display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.dc-row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.dn{display:flex;align-items:center;gap:8px;font-weight:600}
.dn .sw{width:12px;height:12px;border-radius:50%;background:var(--dc)}
.dv{font-variant-numeric:tabular-nums;font-weight:700}
.track{grid-column:1/-1;position:relative;height:14px;border-radius:7px;background:var(--surface-2)}
.track i{display:block;height:100%;border-radius:7px;background:var(--dc)}
.track b{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.55}
.dsub{grid-column:1/-1;font-size:.8rem;color:var(--muted)}
.cap{font-size:.84rem;color:var(--muted);margin:10px 0 0}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fl button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:600}
.fl button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sep{font-size:.76rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);padding:14px 4px 2px;font-weight:600}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;grid-template-areas:"rk nm sc" ". dm bar";gap:2px 10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.row .rk{grid-area:rk;font:700 1rem var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.row .nm{grid-area:nm;font-weight:600}
.row .dm{grid-area:dm;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.row .dm::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dc)}
.row .bar{grid-area:bar;height:8px;border-radius:4px;background:var(--surface-2);min-width:90px}
.row .bar i{display:block;height:100%;border-radius:4px;background:var(--dc)}
.row .sc2{grid-area:sc;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.row .sc2 sup{font-weight:600;color:var(--muted);margin-left:2px}
.row.g1{background:color-mix(in srgb,var(--dc) 12%,var(--surface));border-color:color-mix(in srgb,var(--dc) 40%,var(--line));padding-block:14px}
.row.g1 .nm{font-size:1.1rem;font-family:var(--display)}
.row.g1 .rk{color:var(--dc)}
.row.g3{opacity:.82}
@media (min-width:600px){
  .row{grid-template-columns:30px minmax(0,1fr) 150px 130px 44px;grid-template-areas:"rk nm dm bar sc"}
}
/* analisi */
.abar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:20px 0 6px}
.badge{font-size:.78rem;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--surface-2)}
.words{font-size:.8rem;color:var(--muted)}
.ctx{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.ctx summary{cursor:pointer;font-weight:600}
.ctx p{font-size:.85rem;color:var(--muted);margin:6px 0 8px}
textarea{width:100%;min-height:130px;resize:vertical;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:12px;font:inherit;font-size:.95rem}
.status{min-height:1.4em;font-size:.88rem;color:var(--muted);margin:8px 0 0}
.prose{max-width:66ch;margin-top:8px}
.prose h2{font-size:1.55rem;margin:2.2rem 0 .6rem}
.prose h3{font-size:1.1rem;margin:1.5rem 0 .3rem}
.prose p{margin:.6em 0;line-height:1.65}
.prose ul{padding-left:1.2em;margin:.5em 0}
.prose li{margin:.45em 0;line-height:1.6}
.fine{font-size:.82rem;color:var(--muted);margin-top:36px;border-top:1px solid var(--line);padding-top:16px;max-width:66ch}
.priv{margin-top:14px}.priv .how{margin:8px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div id="app"></div>
<script>
const D=[
 {n:"Esecuzione",s:"Esecuzione",sub:"Come trasformi le intenzioni in risultati",verb:"ti dà concretezza e continuità"},
 {n:"Influenza",s:"Influenza",sub:"Come ti fai sentire e muovi gli altri",verb:"ti fa muovere e coinvolgere gli altri"},
 {n:"Costruzione di relazioni",s:"Relazioni",sub:"Come tieni unite le persone",verb:"ti fa leggere e tenere unite le persone"},
 {n:"Pensiero strategico",s:"Pensiero",sub:"Come analizzi, immagini e scegli la direzione",verb:"ti dà direzione e profondità"}
];
const T=[
{k:"ACH",en:"Achiever",n:"Realizzatore",d:0,s:["A fine giornata mi sento soddisfatto solo se ho portato a termine qualcosa di concreto.","Ho bisogno di sentire che sto avanzando: senza traguardi da spuntare mi spengo."],
 desc:"Hai una spinta interna a concludere: il valore della giornata lo misuri da ciò che hai portato a termine.",
 work:"In un team sei quello che tiene il ritmo, porta la lista a zero e fa avanzare i progetti anche quando l'entusiasmo cala.",
 risk:"Puoi confondere l'essere occupato con l'essere efficace, lavorare troppo e faticare a riposarti quando non c'è un traguardo.",
 give:"energia e costanza per arrivare in fondo",
 act:"Scegli ogni settimana un solo risultato che conta davvero e proteggi del tempo per raggiungerlo, invece di accumulare piccole attività.",
 lev:"Proponi di guidare un progetto con inizio, fine e un risultato misurabile, così da avere una prova concreta da mostrare."},
{k:"ARR",en:"Arranger",n:"Organizzatore",d:0,s:["Quando ho molte cose in corso, mi viene naturale riorganizzare persone e risorse per farle funzionare meglio.","Davanti a un imprevisto, rimescolo i pezzi del piano finché trovo una configurazione che funziona."],
 desc:"Sai vedere come combinare persone, tempi e risorse nel modo più efficiente, e ti piace farlo quando le variabili sono molte.",
 work:"Sei a tuo agio in situazioni complesse e in movimento: riconfiguri il piano quando cambia qualcosa senza perdere il filo.",
 risk:"Puoi continuare a rimescolare anche quando il sistema funziona già, e sembrare poco prevedibile a chi preferisce stabilità.",
 give:"la capacità di far funzionare insieme molte parti",
 act:"Mappa in una pagina tutti i progetti che segui, con responsabili e scadenze: ti serve per vedere dove una riorganizzazione porta davvero valore.",
 lev:"Offriti di coordinare un'iniziativa trasversale con più persone coinvolte, anche piccola, per fare pratica di regia."},
{k:"BEL",en:"Belief",n:"Convinzione",d:0,s:["Scelgo il lavoro in base ai valori in cui credo, anche se pagherebbe di più altrove.","Ci sono principi su cui non scendo a compromessi, e guidano le mie decisioni più importanti."],
 desc:"Hai valori profondi e stabili che orientano ciò che scegli, dove lavori e per cosa ti spendi.",
 work:"Dai senso al lavoro: sei affidabile perché le tue azioni seguono ciò in cui credi, e ti motivano missioni in cui ti riconosci.",
 risk:"Quando un contesto va contro i tuoi valori puoi irrigidirti o chiuderti, e rischi di giudicare chi ragiona con priorità diverse.",
 give:"senso e direzione morale",
 act:"Scrivi i tre valori che non negozi e confronta il tuo lavoro attuale con essi: ti serve come filtro per le prossime scelte.",
 lev:"Cerca organizzazioni o progetti la cui missione dichiarata coincide con i tuoi valori e parla con due persone che ci lavorano."},
{k:"CON",en:"Consistency",n:"Coerenza",d:0,s:["Mi dà fastidio quando le regole valgono per alcuni e non per altri.","Credo che le persone debbano essere trattate con gli stessi criteri, senza eccezioni di favore."],
 desc:"Per te le regole devono valere per tutti allo stesso modo: ti importa che le persone abbiano pari opportunità e criteri trasparenti.",
 work:"Sei un riferimento di equità: porti trasparenza nei criteri di valutazione e metti a disagio i favoritismi.",
 risk:"Puoi apparire rigido davanti a casi particolari che meriterebbero un'eccezione e faticare con ambienti informali.",
 give:"equità e criteri chiari",
 act:"Individua un processo del tuo lavoro in cui i criteri sono poco chiari e proponi una regola semplice e condivisa.",
 lev:"Partecipa alla definizione di criteri di valutazione, onboarding o priorità in un team e documentali."},
{k:"DEL",en:"Deliberative",n:"Cautela",d:0,s:["Prima di decidere valuto con calma i rischi, anche quando gli altri hanno fretta.","Preferisco procedere con prudenza e tenere le informazioni riservate finché non sono sicuro."],
 desc:"Pesi i rischi prima di agire: sei attento, riservato e ti piace decidere con consapevolezza.",
 work:"Sei il collega che vede gli ostacoli prima degli altri e protegge il gruppo da errori costosi.",
 risk:"Puoi rallentare le decisioni, sembrare freddo o negativo e perdere occasioni che richiedono rapidità.",
 give:"prudenza e una lettura del rischio",
 act:"Per le decisioni importanti fissa una scadenza oltre la quale decidi con ciò che hai, anche se non sei al 100% sicuro.",
 lev:"Assumi il ruolo di chi valuta i rischi di un progetto e presenta alternative con probabilità e impatto."},
{k:"DIS",en:"Discipline",n:"Disciplina",d:0,s:["Mi sento a mio agio con routine precise, orari e un ordine che posso prevedere.","Pianifico la mia giornata nei dettagli e mi innervosisco quando il programma salta."],
 desc:"Ti trovi a tuo agio con ordine, routine e prevedibilità: dai struttura al caos.",
 work:"Porti metodo: scadenze rispettate, processi ordinati, dettagli curati.",
 risk:"Puoi irrigidirti quando i piani saltano e giudicare chi lavora in modo più fluido: la struttura può diventare una gabbia.",
 give:"metodo e struttura",
 act:"Costruisci una routine settimanale con tempi dedicati a studio, networking e candidature: ti dà ritmo senza dover decidere ogni volta.",
 lev:"Trasforma una tua routine efficace in un processo o template condivisibile con il team."},
{k:"FOC",en:"Focus",n:"Focalizzazione",d:0,s:["Se mi do un obiettivo, taglio tutto ciò che mi distrae e vado dritto a quello.","Mi serve sapere dove sto andando: con una meta chiara, le priorità si decidono da sole."],
 desc:"Ti serve una direzione chiara: con un obiettivo definito elimini ciò che è accessorio e vai dritto.",
 work:"Sei chi riporta la discussione al punto, fissa le priorità e dice no a ciò che non serve all'obiettivo.",
 risk:"Puoi trascurare opportunità laterali, risultare sbrigativo e fare fatica quando gli obiettivi non sono chiari.",
 give:"priorità e direzione",
 act:"Scrivi un obiettivo di carriera a 12 mesi in una frase e valuta ogni attività della settimana in base a quanto lo avvicina.",
 lev:"Definisci obiettivi trimestrali con indicatori e rivedili ogni mese con una persona di cui ti fidi."},
{k:"RES",en:"Responsibility",n:"Responsabilità",d:0,s:["Quando prendo un impegno, lo considero un debito d'onore e faccio di tutto per rispettarlo.","Se qualcosa va storto in un progetto che porto avanti, sento che tocca a me rimediare."],
 desc:"Senti come tuoi gli impegni presi: se dici che farai una cosa, la fai, e se sbagli ne rispondi.",
 work:"Sei affidabile al massimo: gli altri sanno che possono contare su di te.",
 risk:"Puoi caricarti troppo, faticare a delegare e a dire di no, e vivere gli errori altrui come tuoi.",
 give:"affidabilità e senso del dovere",
 act:"Prima di accettare un nuovo impegno chiediti cosa ti toglie, e prova a dire un no motivato questa settimana.",
 lev:"Chiedi la responsabilità di un risultato intero (non solo di compiti) e impara a delegare parti precise."},
{k:"REP",en:"Restorative",n:"Riparatore",d:0,s:["Mi accendo quando c'è un problema da risolvere e capire cosa si è rotto.","Sono bravo a individuare cosa non funziona in un processo e a rimetterlo in piedi."],
 desc:"Ti piace risolvere problemi: individuare cosa non va e rimetterlo in funzione ti dà energia.",
 work:"Sei il collega a cui si porta ciò che è rotto: processi, relazioni, situazioni critiche.",
 risk:"Puoi vedere solo ciò che manca, criticare più che valorizzare e cercare problemi anche dove non ce ne sono.",
 give:"diagnosi e risoluzione dei problemi",
 act:"Scegli un processo che non funziona e documenta cause, proposta e risultato atteso, anche in un solo foglio.",
 lev:"Proponi di guidare un intervento di miglioramento (un processo, un report, un flusso) misurando prima e dopo."},
{k:"ACT",en:"Activator",n:"Attivatore",d:1,s:["Dopo un po' di discussione mi viene voglia di partire: si impara facendo.","Preferisco iniziare subito e correggere strada facendo, piuttosto che aspettare il piano perfetto."],
 desc:"Trasformi le idee in azione: preferisci partire e imparare dall'esperienza piuttosto che aspettare le condizioni perfette.",
 work:"Sei la scintilla che sblocca le riunioni infinite e mette il gruppo in movimento.",
 risk:"Puoi risultare impaziente, partire senza sufficiente preparazione e bruciare chi ha bisogno di più tempo.",
 give:"avvio e velocità di esecuzione",
 act:"Scegli un'idea che rimandi da tempo e fai un piccolo test entro sette giorni.",
 lev:"Lancia un esperimento a basso costo (un pilota, un prototipo, una prova) con un metro di giudizio fissato prima."},
{k:"COM",en:"Command",n:"Comando",d:1,s:["Se nessuno prende posizione, mi viene naturale farmi avanti e dire cosa si fa.","Non ho problemi a dire apertamente il mio disaccordo, anche quando crea tensione."],
 desc:"Prendi posizione con naturalezza: dici cosa pensi, guidi quando serve e affronti i conflitti senza paura.",
 work:"Nei momenti di crisi o di stallo sei tu a prendere in mano la situazione e a chiarire le decisioni.",
 risk:"Puoi risultare dominante o intimidatorio, non lasciare spazio agli altri e creare scontri evitabili.",
 give:"decisione e capacità di guidare",

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>");}
function md(text){
  let h="",p=[],ul=false;
  const fp=()=>{if(p.length){h+="<p>"+inl(p.join(" "))+"</p>";p=[];}};
  const cl=()=>{if(ul){h+="</ul>";ul=false;}};
  for(const raw of text.replace(/\r/g,"").split("\n")){
    const l=raw.trim();let m;
    if(!l){fp();cl();continue;}
    if((m=l.match(/^(#{1,3})\s+(.*)$/))){fp();cl();const n=Math.max(2,m[1].length);h+=`<h${n}>${inl(m[2])}</h${n}>`;}
    else if((m=l.match(/^[-•]\s+(.*)$/))){fp();if(!ul){h+="<ul>";ul=true;}h+="<li>"+inl(m[1])+"</li>";}
    else{cl();p.push(l);}
  }
  fp();cl();return h;
}

  if(done===N)right=`<button class="btn" data-act="finish">Vedi i risultati</button>`;
  else if(last)right=`<button class="btn ghost" data-act="jump" data-i="${firstMiss}">Mancano ${miss} risposte: vai alla prima</button>`;
  else right=`<button class="btn" data-act="next"${v==null?" disabled":""}>Avanti →</button>`;
  app.innerHTML=`<div class="wrap">
  <header class="topbar"><div class="tb-row"><span class="brand">Mappa dei Talenti</span><span aria-live="polite">Domanda ${i+1} di ${N}</span></div>
   <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${done}" aria-label="Risposte date"><i style="width:${done/N*100}%"></i></div></header>
  <main>
   <p class="eyebrow">Quale ti descrive meglio?</p>
   <div class="pair">
    <div class="st ${c1}"><span class="num">1</span><p>${esc(q.s1)}</p></div>
    <div class="or" aria-hidden="true">oppure</div>
    <div class="st ${c2}"><span class="num">2</span><p>${esc(q.s2)}</p></div>
   </div>
   ${scaleHTML(v,false)}
   <div class="nav"><button class="btn ghost" data-act="back"${i===0?" disabled":""}>← Indietro</button>${right}</div>
   <p class="hint">Scorciatoie: tasti 1-5 per rispondere, frecce sinistra e destra per spostarti.</p>
   <div class="dots" aria-label="Elenco domande">${S.answers.map((a,k)=>`<button type="button" class="${a!=null?"a":""} ${k===i?"c":""}" data-act="jump" data-i="${k}" aria-label="Vai alla domanda ${k+1}${a!=null?" (risposta data)":""}"></button>`).join("")}</div>
  </main></div>`;
}
function rowsHTML(){
  const res=S.res,f=S.filter;let h="",lastG=0;
  res.rank.forEach(r=>{
    const t=T[r.t];if(f!=="all"&&String(t.d)!==f)return;
    const g=r.rank<=5?1:r.rank<=10?2:3;
    if(f==="all"&&g!==lastG){h+=`<li class="sep">${g===1?"Talenti dominanti":g===2?"Talenti di supporto":"Meno marcati"}</li>`;lastG=g;}
    h+=`<li class="row g${g}" data-d="${t.d}"><span class="rk">${r.rank}</span><span class="nm">${t.n}</span><span class="dm">${D[t.d].s}</span><span class="bar"><i style="width:${r.pts/8*100}%"></i></span><span class="sc2">${r.pts}${r.tie?'<sup title="Pari merito con il tema precedente">=</sup>':""}</span></li>`;
  });
  return h;
}
function rankPanel(){
  const res=S.res,top=res.rank.slice(0,5);
  const srt=[...res.dom].sort((a,b)=>b.avg-a.avg),hi=srt[0],lo=srt[3];
  return `<div role="tabpanel">
  <h2 class="h-md">I tuoi 5 temi dominanti</h2>
  <ul class="chips">${top.map(r=>`<li class="chip" data-d="${T[r.t].d}"><b>${r.rank}</b>${T[r.t].n}</li>`).join("")}</ul>
  <h2 class="h-md">I 4 domini</h2>
  <div class="dcw">${res.dom.map(x=>`<div class="dc-row" data-d="${x.d}"><span class="dn"><i class="sw"></i>${D[x.d].n}</span><span class="dv">${fmt(x.avg)}</span><div class="track"><i style="width:${x.avg/8*100}%"></i><b></b></div><span class="dsub">${x.top10} ${x.top10===1?"tema":"temi"} nei primi 10</span></div>`).join("")}</div>
  <p class="cap">Punteggio medio per tema, su una scala da 0 a 8. La linea segna il valore neutro (4): in un test a scelta forzata la media complessiva è sempre 4, quindi conta lo scarto. Il dominio più forte per te è ${D[hi.d].n} (${fmt(hi.avg)}), il meno presente ${D[lo.d].n} (${fmt(lo.avg)}).</p>
  <h2 class="h-md">Classifica completa</h2>
  <div class="fl" id="fl">${[["all","Tutti"],["0","Esecuzione"],["1","Influenza"],["2","Relazioni"],["3","Pensiero"]].map(([k,l])=>`<button type="button" data-act="filter" data-f="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join("")}</div>
  <ol class="rank" id="rank">${rowsHTML()}</ol>
  <p class="cap">Il segno "=" indica un pari merito con il tema precedente: in quel caso l'ordine dipende dalla nettezza delle tue scelte. Ogni tema compare in sole due coppie, quindi punteggi vicini non sono davvero distinguibili.</p>
  <div class="actions"><button class="btn" data-act="tab" data-tab="analysis">Leggi la tua analisi →</button></div></div>`;
}
const ERR={not_granted:"Non hai consentito alla pagina di usare Claude: resta disponibile l'analisi di base.",sampling_disabled:"Claude non è disponibile per questo account: resta l'analisi di base.",not_declared:"Claude non è disponibile in questa pagina.",capability_disabled:"Claude non è disponibile in questa visualizzazione.",capability_removed:"Claude non è disponibile in questa visualizzazione.",rate_limited:"Troppe richieste o limite di utilizzo raggiunto: riprova più tardi.",session_expired:"Sessione scaduta: accedi di nuovo a Claude e riprova.",refused:"Claude non ha potuto elaborare la richiesta. Modifica il contesto e riprova.",empty_completion:"Claude non ha restituito testo: riprova.",prompt_too_large:"Il contesto è troppo lungo: accorcialo.",upstream_error:"Connessione interrotta: riprova."};
const PERM=["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];
function analysisPanel(){
  const can=!!S.sample&&!S.sampleOff&&!S.demo;
  const ask=can?`<details class="ctx"><summary>Contesto personale (facoltativo, modificabile)</summary><p>Viene inviato a Claude solo quando scrivi l'analisi, per rendere più mirati ruoli, settori e piano. Puoi modificarlo o svuotarlo.</p><textarea id="ctx" maxlength="1500">${esc(S.ctx)}</textarea></details>
   <div class="actions" style="margin-top:14px"><button class="btn" id="ask" data-act="ask"></button><button class="btn ghost" id="stop" data-act="stop" hidden>Interrompi</button><button class="btn ghost" id="toggle" data-act="toggle" hidden></button></div>`
   :(S.demo?`<p class="cap">Questa è l'analisi di base, calcolata dai punteggi dell'esempio (profilo fittizio). Nell'esempio la riscrittura con Claude è disattivata.</p>`:S.sampleReady?`<p class="cap">Questa è l'analisi di base, calcolata dai tuoi punteggi. In una visualizzazione con Claude disponibile potrai farla riscrivere su misura.</p>`:"");
  return `<div role="tabpanel"><div class="abar"><span class="badge" id="badge"></span><span class="words" id="words"></span></div>${ask}
  <p class="status" id="status" aria-live="polite"></p><article class="prose" id="prose"></article>
  <p class="fine">Analisi indicativa, basata su affermazioni originali ispirate al modello CliftonStrengths. Non è il test ufficiale Gallup, non ha validità scientifica e non sostituisce una valutazione professionale: usala come spunto per riflettere e verificare nella pratica.</p></div>`;
}
function paintAnalysis(){
  const prose=$("#prose");if(!prose)return;
  const cl=S.mode==="claude"&&S.claude,text=cl?S.claude:S.res.local;
  prose.innerHTML=md(text);
  $("#badge").textContent=cl?"Scritta da Claude sui tuoi risultati":(S.demo?"Analisi di base, calcolata dai punteggi dell'esempio":"Analisi di base, calcolata dai tuoi punteggi");
  $("#words").textContent="≈ "+wc(text)+" parole";
  $("#status").textContent=S.status;
  const ask=$("#ask");if(ask){ask.textContent=S.claude?"Riscrivi con Claude":"Scrivi l'analisi con Claude";ask.disabled=S.busy;
    $("#stop").hidden=!S.busy;const tg=$("#toggle");tg.hidden=!(S.claude&&!S.busy);tg.textContent=S.mode==="claude"?"Mostra l'analisi di base":"Mostra quella di Claude";}
}
function rResults(){
  const t=S.tab;
  app.innerHTML=`<div class="wrap"><div class="rh"><h1>${S.demo?"Risultati dell'esempio":"I tuoi risultati"}</h1><p>Esito indicativo: non equivale al test ufficiale Gallup e non ha validità scientifica.</p>${S.demo?`<div class="note priv" role="note"><strong>Esempio dimostrativo.</strong> Queste risposte sono simulate da un profilo fittizio: non sono i miei risultati reali. Ho usato un esempio per tutelare la mia privacy.</div>`:""}
  <div class="rtools">${S.demo?`<button class="btn ghost sm" data-act="exitdemo">Esci dall'esempio</button>`:`<button class="btn ghost sm" data-act="edit">Modifica le risposte</button><button class="btn ghost sm" data-act="restart">${S.confirmReset?"Conferma: cancella tutto":"Ricomincia"}</button>`}</div></div>
  <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="${t==="rank"}" data-act="tab" data-tab="rank">Classifica e domini</button><button class="tab" role="tab" aria-selected="${t==="analysis"}" data-act="tab" data-tab="analysis">Analisi per la carriera</button></div>
  ${t==="rank"?rankPanel():analysisPanel()}</div>`;
  if(t==="analysis")paintAnalysis();
}
function render(){({intro:rIntro,test:rTest,results:rResults})[S.screen]();}
function toTop(){window.scrollTo({top:0});}
async function askClaude(){
  if(!S.sample||S.busy)return;
  const regen=!!S.claude;S.busy=true;S.status="Claude sta ragionando sui tuoi risultati: può richiedere uno o due minuti.";S.ctl=new AbortController();paintAnalysis();
  let began=false;
  try{
    const opts={modelTier:"complex",signal:S.ctl.signal,
      onText:({text})=>{if(!began){began=true;S.mode="claude";}S.claude=text;S.status="Claude sta scrivendo…";paintAnalysis();}};
    if(regen)opts.cache=false;
    const r=await S.sample(buildPrompt(S.res,S.ctx),opts);
    S.claude=r.text;S.sig=S.answers.join("");S.status=r.truncated?"Il testo è stato interrotto per lunghezza. Puoi riscriverlo.":"Analisi completata.";
  }catch(e){
    const code=e&&e.code;
    if(e&&e.text&&code!=="refused"){S.claude=e.text;S.mode="claude";S.status=code==="cancelled"?"Interrotta: resta il testo scritto finora.":(ERR[code]||"Interrotta.")+" Resta il testo scritto finora.";}
    else{S.claude="";S.mode="local";S.status=code==="cancelled"?"Interrotta.":(ERR[code]||"Qualcosa non ha funzionato: riprova.");}
    if(PERM.includes(code))S.sampleOff=true;
  }
  S.busy=false;S.ctl=null;
  if(S.screen==="results"&&S.tab==="analysis"){if(S.sampleOff)rResults();else paintAnalysis();}
}
function go(act,el){
  if(act!=="pick")clearTimeout(advT);
  switch(act){
    case "start":S.q=0;S.screen="test";render();toTop();break;
    case "resume":{const m=S.answers.findIndex(x=>x==null);S.q=m<0?0:m;S.screen="test";render();toTop();break;}
    case "restart":
      if(S.screen==="results"&&!S.confirmReset){S.confirmReset=true;render();setTimeout(()=>{if(S.confirmReset){S.confirmReset=false;if(S.screen==="results")render();}},4000);break;}
      S.confirmReset=false;S.answers=Array(N).fill(null);S.q=0;S.claude="";S.mode="local";S.status="";S.res=null;clear();S.screen="test";render();toTop();break;
    case "pick":{
      const v=+el.dataset.v,first=S.answers[S.q]==null;S.answers[S.q]=v;save();render();
      clearTimeout(advT);
      if(first&&S.q<N-1)advT=setTimeout(()=>{if(S.screen==="test"){S.q++;save();render();}},260);
      break;}
    case "back":if(S.q>0){S.q--;save();render();}break;
    case "next":if(S.q<N-1&&S.answers[S.q]!=null){S.q++;save();render();}break;
    case "jump":S.q=+el.dataset.i;save();render();break;
    case "finish":{
      if(doneCount()<N)break;
      S.res=analyze(S.answers);
      if(S.sig!==S.answers.join("")){S.claude="";S.mode="local";S.status="";}
      S.screen="results";S.tab="rank";S.confirmReset=false;render();toTop();break;}
    case "edit":S.screen="test";S.q=0;S.confirmReset=false;render();toTop();break;
    case "tab":S.tab=el.dataset.tab;render();toTop();break;
    case "filter":S.filter=el.dataset.f;{const l=$("#rank");if(l){l.innerHTML=rowsHTML();document.querySelectorAll("#fl button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.f===S.filter)));}}break;
    case "demo":S.demo=true;S.answers=SAMPLE_ANSWERS.slice();S.claude="";S.mode="local";S.status="";S.sig="";S.filter="all";S.res=analyze(S.answers);S.screen="results";S.tab="rank";S.confirmReset=false;render();toTop();break;
    case "exitdemo":S.demo=false;S.answers=Array(N).fill(null);S.q=0;S.res=null;S.claude="";S.mode="local";S.status="";S.sig="";load();S.screen="intro";render();toTop();break;
    case "ask":askClaude();break;
    case "stop":if(S.ctl)S.ctl.abort();break;
    case "toggle":S.mode=S.mode==="claude"?"local":"claude";paintAnalysis();break;
  }
}
app.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el&&!el.disabled)go(el.dataset.act,el);});
app.addEventListener("input",e=>{if(e.target.id==="ctx")S.ctx=e.target.value;});
document.addEventListener("keydown",e=>{
  if(S.screen!=="test"||e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(/^[1-5]$/.test(e.key))go("pick",{dataset:{v:e.key}});
  else if(e.key==="ArrowLeft")go("back");
  else if(e.key==="ArrowRight")go("next");
});
load();render();
(async()=>{
  try{if(window.claude&&window.claude.use)S.sample=await window.claude.use("sample");}catch(e){S.sample=null;}
  S.sampleReady=true;
  if(S.screen==="results"&&S.tab==="analysis"&&!S.busy)rResults();
})();
</script>

</body></html>
